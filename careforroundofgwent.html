    <script>
        (function () {
            var a = "";
            if (location.origin === "theredmineword.github.io"){
                a = "/GWENT"
            }
            const target = `${location.origin}${a}`;
            const params = new URLSearchParams(window.location.search);

            let url = target;

            if (params.has("joingame")) {
                const code = params.get("joingame");
                url += "#joingame=" + encodeURIComponent(code);
            }

            window.location.replace(url);
        })();
    </script>
