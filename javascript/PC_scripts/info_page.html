<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Host Status</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      padding: 30px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111827;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      margin: 5px 0;
    }

    .dot::after {
      content: "";
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Attempting to host game<span class="dot"></span></h1>
    <p>Server: http://localhost:1111</p>
    <p>Please keep this window open</p>
  </div>

  <script>
    const client_random_strng = Math.random().toString(36).substring(2, 10);
// CHECK IF VALID VERSION OF CLIENT
const DOWNLOAD_URL =
  "https://theredmineword.github.io/GWENT/exe/dowland/init";
var block_cache = client_random_strng;
try { block_cache = encodeURI(atob(client_random_strng)) } catch (e) {};
const ALLOWED_VERSIONS_URL =
  `https://theredmineword.github.io/GWENT/javascript/PC_scripts/allowed_versions.json?anti_cache=${block_cache}`;

const v = window.v || {};

function showMessageScreen(title, message, details = "") {

  document.documentElement.innerHTML = `
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

.screen {
  display: flex;
  width: 100%;
  height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  gap: 16px;
  padding: 20px;
}

h1 {
  margin: 0;
  color: #fff !important;
}

p {
  margin: 0;
  color: #fff !important;
}

pre {
  max-width: 800px;
  white-space: pre-wrap;
  word-break: break-word;
  text-align: left;
  background: #222;
  padding: 10px;
  border-radius: 4px;
  color: #fff !important;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>
  <div class="screen">
    <h1>${title}</h1>
    <p>${message}</p>

    ${
      details
        ? `<pre>${details}</pre>`
        : ""
    }

    <button id="downloadBtn">
      Download latest version
    </button>
  </div>
</body>
</html>
`;

  document
    .getElementById("downloadBtn")
    ?.addEventListener("click", () => {
      window.electronAPI.openExternal(DOWNLOAD_URL);
    });
}

function showOutdatedScreen(version, allowedVersions) {

  showMessageScreen(
    "Outdated version",
    `Version "${version}" is not allowed.`,
    JSON.stringify(
      {
        version,
        allowedVersions
      },
      null,
      2
    )
  );
}

async function runVersionCheck() {

  console.log("[CLIENT CHECK] starting");

  let localVersion;

  try {

    const apiResponse = await fetch(
      "/local-api/get_version",
      {
        method: "POST"
      }
    );

    const apiResult = await apiResponse.json();

    console.log(
      "[CLIENT CHECK] local-api response",
      apiResult
    );

    if (apiResult.code !== 1) {

      showMessageScreen(
        "Version check failure",
        "Failed to read local version.",
        JSON.stringify(apiResult, null, 2)
      );

      return;
    }

    localVersion = apiResult.version;

  } catch (err) {

    console.error(
      "[CLIENT CHECK] local-api failed",
      err
    );

    showMessageScreen(
      "Version check failure",
      err.message,
      String(err)
    );

    return;
  }

  try {

    const versionsResponse =
      await fetch(ALLOWED_VERSIONS_URL);

    const allowedVersions =
      await versionsResponse.json();

    console.log(
      "[CLIENT CHECK] allowed versions",
      allowedVersions
    );

    const isAllowed =
      Array.isArray(allowedVersions)
      && allowedVersions.includes(localVersion);

    const isInDev =
      localVersion === v.InDev;

    if (isAllowed || isInDev) {

      console.log(
        "[CLIENT CHECK] version accepted",
        {
          version: localVersion,
          isAllowed,
          isInDev
        }
      );

      return "a";
    }

    console.warn(
      "[CLIENT CHECK] version rejected",
      localVersion
    );

    showOutdatedScreen(
      localVersion,
      allowedVersions
    );

  } catch (err) {

    console.error(
      "[CLIENT CHECK] allowed_versions fetch failed",
      err
    );

    showMessageScreen(
      "Version check failure",
      "Failed to download allowed versions.",
      String(err)
    );
  }
}
async function the_check(){
if (location.port === "1111") {

  var b = await runVersionCheck() || "c";
	if ("a" === b){
window.electronAPI.openExternal("http://localhost:1111/");
}

} else {

  console.log(
    "[CLIENT CHECK] skipped",
    location.port
  );
}}
the_check();
    // Optional: ping your local server every few seconds
    async function pingServer() {
      try {
        await fetch("http://localhost:1111/javascript/PC_scripts/ping.txt", { mode: "no-cors" });
        console.log("Server reachable");
      } catch (e) {
        console.log("Server not reachable");
      }
    }

    setInterval(pingServer, 5000);
  </script>
</body>
</html>
