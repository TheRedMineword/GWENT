<style>
    :root {
        --bg: #120b08;
        --card: #21130d;
        --text: #f4ead8;
        --muted: #c7b9a3;
        --gold: #d9ad55;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
    }

    .gwent-card {
        width: min(600px, 100%);
        padding: 48px 32px;
        text-align: center;
        background: var(--card);
        border: 1px solid rgba(217, 173, 85, .4);
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
    }

    .crest {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        display: block;
        object-fit: contain;
    }

    h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.1;
    }

    .rule {
        width: 90px;
        height: 1px;
        margin: 20px auto;
        background: var(--gold);
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding: 10px 16px;
        border: 1px solid rgba(217, 173, 85, .3);
        border-radius: 20px;
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: .05em;
    }

    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
        50% {
            opacity: .4;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .dot {
            animation: none;
        }
    }
</style>

<body>
    <main class="gwent-card" aria-live="polite">
