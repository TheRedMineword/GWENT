<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Debug Player</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0}
#player{width:100%;aspect-ratio:16/9;background:#000}
.top{padding:10px;background:#1b1b1b}
#logs{height:300px;overflow:auto;background:#000;color:#0f0;
padding:10px;font-family:monospace;white-space:pre-wrap;border-top:1px solid #333}
button{padding:6px 10px}
</style>
</head>
<body>
<div class="top">
<b>YouTube Debug Player</b><br>
Supports:
<ul>
<li>?v=VIDEO_ID</li>
<li>?v=https://www.youtube.com/watch?v=...</li>
<li>?autoplay=1</li>
</ul>
<button onclick="copyLogs()">Copy Logs</button>
</div>

<div id="player"></div>
<div id="logs"></div>

<script>
const logBox=document.getElementById("logs");

function log(...args){
 const msg=args.map(a=>typeof a==="object"?JSON.stringify(a,null,2):String(a)).join(" ");
 console.log(...args);
 logBox.textContent += "["+new Date().toLocaleTimeString()+"] "+msg+"\\n";
 logBox.scrollTop=logBox.scrollHeight;
}

function copyLogs(){
 navigator.clipboard.writeText(logBox.textContent);
 log("Logs copied");
}

function extractVideoId(input){
 if(!input) return null;

 const patterns=[
  /^([a-zA-Z0-9_-]{11})$/,
  /[?&]v=([a-zA-Z0-9_-]{11})/,
  /youtu\.be\/([a-zA-Z0-9_-]{11})/,
  /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/
 ];

 for(const p of patterns){
   const m=String(input).match(p);
   if(m) return m[1];
 }
 return null;
}

const params=new URLSearchParams(location.search);
const raw=params.get("v");
const autoplay=params.get("autoplay")==="1";
const videoId=extractVideoId(raw);

log("Page loaded");
log("Raw v param:", raw);
log("Detected videoId:", videoId);
log("Autoplay:", autoplay);

window.onYouTubeIframeAPIReady=function(){
 log("YouTube Iframe API ready");

 if(!videoId){
   log("ERROR: No valid video id found");
   return;
 }

 window.player=new YT.Player("player",{
   videoId,
   playerVars:{
      autoplay: autoplay ? 1 : 0,
      playsinline:1,
      rel:0,
      modestbranding:1,
      controls:1,
      iv_load_policy:3,
      enablejsapi:1
   },
   events:{
      onReady:(e)=>{
        log("Player ready");
        log("Current URL:", location.href);
        if(autoplay){
          e.target.playVideo();
          log("Autoplay requested");
        }
      },
      onStateChange:(e)=>{
        const states={
          "-1":"UNSTARTED",
          "0":"ENDED",
          "1":"PLAYING",
          "2":"PAUSED",
          "3":"BUFFERING",
          "5":"CUED"
        };
        log("State:", states[String(e.data)] || e.data);
      },
      onError:(e)=>{
        log("PLAYER ERROR:", e.data);
      }
   }
 });

 setInterval(()=>{
   try{
     if(window.player && player.getCurrentTime){
       log("Time:", player.getCurrentTime().toFixed(2));
     }
   }catch(err){}
 },10000);
};

const tag=document.createElement("script");
tag.src="https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
log("Loading iframe API...");
</script>
</body>
</html>
