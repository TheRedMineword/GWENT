<button onclick="send()">Send Broadcast</button>

<h3>Response</h3>
<pre id="result"></pre>

<script>
async function send() {
    const result = document.getElementById("result");

    let payload;

    try {
        payload = JSON.parse(document.getElementById("json").value);
    } catch (e) {
        result.textContent = "Invalid JSON:\n" + e.message;
        return;
    }

    try {
        const response = await fetch(document.getElementById("url").value, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Admin-Key": document.getElementById("key").value
            },
            body: JSON.stringify({
                payload
            })
        });

        const text = await response.text();

        try {
            result.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
            result.textContent = text;
        }

    } catch (e) {
        result.textContent = e.toString();
    }
}
</script>
